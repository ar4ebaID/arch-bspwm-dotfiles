[global/wm]
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini

[bar/dp-0]
monitor = DP-0

width = 99%
height = 32px
radius = 1

offset-x = 0.5%
offset-y = 1%

border-size = 6px
border-color = ${colors.background}

dpi = 100

background = ${colors.background}
foreground = ${colors.white}

padding-left = 0
padding-right = 0

module-margin = 0

font-0 = MartianMono Nerd Font:size=12;4
font-1 = MartianMono Nerd Font:size=16;4
font-2 = MartianMono Nerd Font:size=10;3
font-3 = MartianMono Nerd Font:size=24;7
font-4 = MartianMono Nerd Font:size=20;5
font-5 = MartianMono Nerd Font:size=14;4

modules-left = sep round-left menu round-right sep sep round-left xworkspaces round-right
modules-center = cpu gpu memory
modules-right = round-left systray round-right sep sep round-left pulseaudio round-right sep sep round-left xkeyboard round-right sep sep round-left date round-right sep sep round-left powermenu round-right sep

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm
;---------------------------------------------

[bar/hdmi-0]
monitor = HDMI-0

width = 99%
height = 25pt
radius = 1

offset-x = 0.5% 
offset-y = 1%

dpi = 100

background = ${colors.background}
foreground = ${colors.white}

line-size = 3pt

border-size = 6px
border-color = ${colors.background}

padding-left = 0
padding-right = 0

module-margin = 0

font-0 = MartianMono Nerd Font:size=12;4
font-1 = MartianMono Nerd Font:size=16;4
font-2 = MartianMono Nerd Font:size=10;3
font-3 = MartianMono Nerd Font:size=24;7
font-4 = MartianMono Nerd Font:size=20;5
font-5 = MartianMono Nerd Font:size=14;4

modules-left = sep round-left menu round-right sep sep round-left xworkspaces round-right
modules-center = cpu gpu memory
modules-right = round-left pulseaudio round-right sep sep round-left xkeyboard round-right sep sep round-left date round-right sep sep round-left powermenu round-right sep

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

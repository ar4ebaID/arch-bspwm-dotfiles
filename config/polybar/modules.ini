[module/systray]
type = internal/tray
tray-padding = 10px
tray-size = 85%
tray-sorted = true
;tray-background = ${colors.background-alt}
;tray-spacing-background = ${colors.background-alt}
;format-background = ${colors.background-alt}

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
inline-module = true
enable-click = true
enable-scroll = true
reverse-scroll = false

label-active = "󰮯"
label-active-foreground = ${colors.yellow}
label-active-padding = 1
label-active-background = ${colors.background-alt}
label-active-font = 6

label-occupied = ""
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-occupied-background = ${colors.background-alt}
label-occupied-font = 6

label-empty = ""
label-empty-foreground = ${colors.foreground}
label-empty-padding = 1
label-empty-background = ${colors.background-alt}
label-empty-font = 6

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.red}
;format-volume-prefix-background = ${colors.background-alt}
format-volume = <label-volume>
format-volume-prefix-font = 2
label-volume = %percentage%%
;label-volume-background = ${colors.background-alt}
label-muted = " mute"
label-muted-foreground = ${colors.red}
;label-muted-background = ${colors.background-alt}
use-ui-max = false 

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.white}
;label-layout-background = ${colors.background-alt}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
label = %percentage_used:1%%
format-prefix-font = 2
;format-prefix-background = ${colors.background-alt}
;label-background = ${colors.background-alt}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = "%percentage:1%%  "
format-prefix-font = 2
;format-prefix-background = ${colors.background-alt}
;label-background = ${colors.background-alt}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
format-background = ${colors.background-alt}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %d.%m.%Y | %H:%M

label = %date%
label-foreground = ${colors.white}
;label-background = ${colors.background-alt}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/gpu]
type = custom/script
exec = ~/.config/scripts/nvidia-status.sh
interval = 1
format-prefix = "󰽟 "
format-prefix-foreground = ${colors.green}
label = "%output%%  "
format-prefix-font = 2
;format-prefix-background = ${colors.background-alt}
;label-background = ${colors.background-alt}

[module/powermenu]
type = custom/text 
content ="󰐥"
click-left = sh $HOME/.config/scripts/powermenu.sh &
content-foreground = ${colors.red}
content-font = 5
content-background = ${colors.background-alt}

[module/menu]
type = custom/text 
content = ""
content-padding-left = 1
click-left = rofi -show drun
content-foreground = ${colors.purple}
content-background = ${colors.background-alt}
content-font = 4

[module/round-left]
type = custom/text
content =""
content-font = 5
content-foreground = ${colors.background-alt}

[module/round-right]
type = custom/text
content =""
content-font = 5
content-foreground = ${colors.background-alt}

[module/sep] 
type = custom/text
content = " "
content-padding = 0

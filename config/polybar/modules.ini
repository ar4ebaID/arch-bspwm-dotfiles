[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 15pt
format-tray-font = 1

tray-size = 50%

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= #5380c6
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = #7987AD
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = #bf6960
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = " mute"
label-muted-foreground = #bf6960

use-ui-max = false

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = #FFFFFF

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 1
format-prefix = " "
format-prefix-foreground = #EFDC61
label = %percentage_used:1%%
format-prefix-font = 2

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = " "
format-prefix-foreground = #61afef
label = %percentage:1%%
format-prefix-font = 2

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %d.%m.%Y | %H:%M

label = %date%
label-foreground = #FFFFFF

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/gpu]
type = custom/script
exec = ~/.config/scripts/nvidia-status.sh
interval = 1
format-prefix = " "
format-prefix-foreground = #60d957
label = %output%%
format-prefix-font = 2

[module/powermenu]
type = custom/text 
content =" " 
content-padding = 1
click-left = sh $HOME/.config/scripts/powermenu.sh &
content-foreground = #d35f5e
content-font = 2


[module/menu]
type = custom/text 
content =""
content-padding = 1
click-left = rofi -show drun
content-foreground =  #61afef
content-font = 2
